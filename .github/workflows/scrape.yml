name: Descarga diaria de precios

on:
  schedule:
    - cron: "0 15 * * *"  # 15:00 UTC = 09:00 en Costa Rica
  workflow_dispatch:      # también se puede lanzar a mano desde la pestaña Actions
    inputs:
      store:
        description: Tienda a descargar ("todas" para las ocho). La lista está en .github/stores.json
        type: choice
        default: todas
        options:
          - todas
          - Más x Menos
          - Walmart
          - Maxi Pali
          - Pequeño Mundo
          - Automercado
          - Megasuper
          - Perimercados
          - PriceSmart

permissions:
  contents: read
  actions: read

# Un trabajo por tienda: corren en paralelo y si una falla, las otras siguen.
# Después se carga a Databricks, se transforma con dbt y, si algo falló, se avisa por correo.
jobs:
  plan:
    name: Elegir tiendas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: pick
        env:
          STORE: ${{ inputs.store || 'todas' }}
        run: |
          matrix=$(jq -c --arg s "$STORE" '{include: map(select($s == "todas" or .name == $s))}' .github/stores.json)
          if [ "$(echo "$matrix" | jq '.include | length')" = "0" ]; then
            echo "No hay ninguna tienda llamada '$STORE' en .github/stores.json"; exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Tiendas: $(echo "$matrix" | jq -r '[.include[].name] | join(", ")')"

  scrape:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descargar catálogo (SQLite temporal)
        run: ${{ matrix.run }}

      - name: Subir a Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python -m sync.to_turso --fail-unless-ok

  # Cuando terminan las tiendas, copia Turso a Databricks (esquema raw). Una falla aquí no afecta
  # a las descargas (son trabajos aparte), pero sí se ve en rojo y dispara el aviso por correo.
  databricks:
    name: Cargar a Databricks
    needs: scrape
    if: ${{ !cancelled() }}  # corre aunque alguna tienda haya fallado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-databricks.txt

      - run: pip install -r requirements-databricks.txt

      - name: Copiar Turso a Databricks
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python -m sync.to_databricks

  # Transforma raw -> refined (y más adelante analytics) con dbt y corre sus pruebas de calidad.
  dbt:
    name: Transformar con dbt
    needs: databricks
    if: ${{ !cancelled() && needs.databricks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      - run: pip install -r dbt/requirements.txt

      - name: dbt build (modelos y pruebas)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: dbt build --project-dir dbt --profiles-dir dbt

  notify:
    name: Avisar por correo
    needs: [plan, scrape, databricks, dbt]
    if: ${{ failure() }}  # solo si algún trabajo anterior falló
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Enviar correo con los trabajos que fallaron
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python3 ops/notify_failure.py
