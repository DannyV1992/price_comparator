name: Descarga diaria de precios

on:
  schedule:
    - cron: "0 9 * * *"  # 09:00 UTC = 03:00 en Costa Rica
  workflow_dispatch:      # también se puede lanzar a mano desde la pestaña Actions

# Un trabajo por tienda: corren en paralelo y si una falla, las otras siguen.
jobs:
  scrape:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Más x Menos,   run: python scraper/vtex.py masxmenos, timeout: 120 }
          - { name: Walmart,       run: python scraper/vtex.py walmart,    timeout: 180 }
          - { name: Maxi Pali,     run: python scraper/vtex.py maxipali,   timeout: 120 }
          - { name: Pequeño Mundo, run: python scraper/pequenomundo.py,    timeout: 30 }
          - { name: Automercado,   run: python scraper/automercado.py,     timeout: 60 }
          - { name: Megasuper,     run: python scraper/instaleap.py megasuper,    timeout: 60 }
          - { name: Perimercados,  run: python scraper/instaleap.py perimercados, timeout: 60 }
          - { name: PriceSmart,    run: python scraper/pricesmart.py,      timeout: 60 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descargar catálogo (SQLite temporal)
        run: ${{ matrix.run }}

      - name: Subir a Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python scraper/sync_turso.py --fail-unless-ok

  # Cuando terminan todas las tiendas, copia Turso a Databricks (esquema raw). Es un paso extra:
  # si falla, la descarga diaria no se ve afectada.
  databricks:
    name: Cargar a Databricks
    needs: scrape
    if: ${{ !cancelled() }}  # corre aunque alguna tienda haya fallado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-databricks.txt

      - run: pip install -r requirements-databricks.txt

      - name: Copiar Turso a Databricks
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python scraper/sync_databricks.py

  # Transforma raw -> refined (y más adelante analytics) con dbt y corre sus pruebas de calidad.
  dbt:
    name: Transformar con dbt
    needs: databricks
    if: ${{ !cancelled() && needs.databricks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      - run: pip install -r dbt/requirements.txt

      - name: dbt build (modelos y pruebas)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: dbt build --project-dir dbt --profiles-dir dbt
