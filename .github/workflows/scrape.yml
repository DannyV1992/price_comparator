name: Descarga diaria de precios

on:
  schedule:
    - cron: "0 9 * * *"  # 09:00 UTC = 03:00 en Costa Rica
  workflow_dispatch:      # también se puede lanzar a mano desde la pestaña Actions

# Un trabajo por tienda: corren en paralelo y si una falla, las otras siguen.
jobs:
  masxmenos:
    name: Más x Menos
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descargar catálogo (SQLite temporal)
        run: python scraper/vtex.py masxmenos

      - name: Subir a Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python scraper/sync_turso.py --fail-unless-ok

  walmart:
    name: Walmart
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descargar catálogo (SQLite temporal)
        run: python scraper/vtex.py walmart

      - name: Subir a Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python scraper/sync_turso.py --fail-unless-ok

  pequenomundo:
    name: Pequeño Mundo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descargar catálogo (SQLite temporal)
        run: python scraper/pequenomundo.py

      - name: Subir a Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python scraper/sync_turso.py --fail-unless-ok
