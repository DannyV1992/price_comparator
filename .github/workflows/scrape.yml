name: Descarga diaria de Más x Menos

on:
  schedule:
    - cron: "0 9 * * *"  # 09:00 UTC = 03:00 en Costa Rica
  workflow_dispatch:      # también se puede lanzar a mano desde la pestaña Actions

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descargar catálogo (SQLite temporal)
        run: python scraper/masxmenos.py

      - name: Subir a Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python scraper/sync_turso.py --fail-unless-ok
