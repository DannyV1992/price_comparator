name: comparador
version: "1.0.0"
profile: comparador

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

clean-targets: ["target", "dbt_packages"]

# Convención de dbt: staging -> intermediate -> marts. Cada capa tiene su esquema en el lakehouse:
# raw (datos como llegan) -> refined (staging) -> intermediate -> analytics (marts).
models:
  comparador:
    staging:
      +schema: refined
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: analytics
      +materialized: table
