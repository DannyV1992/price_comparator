version: 2

models:
  - name: dim_stores
    description: Tiendas, con su tipo de establecimiento (seed store_info).
    columns:
      - name: store_id
        data_tests: [unique, not_null]
      - name: store_type
        data_tests: [not_null]

  - name: dim_products
    description: Un producto por SKU de tienda, con tienda y categoría. ean_key sirve para cruzar entre tiendas.
    columns:
      - name: store_product_id
        data_tests: [unique, not_null]
      - name: store_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_stores'), field: store_id}}
      - name: canonical_product_id
        description: Producto canónico al que pertenece (NULL si todavía no se pudo cruzar con otras tiendas).
        data_tests:
          - relationships: {arguments: {to: ref('dim_canonical_products'), field: canonical_product_id}}

  - name: dim_canonical_products
    description: El mismo producto visto en una o varias tiendas. Hoy se cruza por código de barras normalizado.
    columns:
      - name: canonical_product_id
        data_tests: [unique, not_null]
      - name: n_stores
        description: En cuántas tiendas se vende (contando también los cruces por nombre).
        data_tests: [not_null]
      - name: match_methods
        description: Cómo se cruzaron sus productos (ean, name, manual).

  - name: fct_price_comparison
    description: >
      Precio de cada producto canónico en cada tienda, solo para productos que se venden en 2 o más tiendas.
      Sirve para saber dónde es más barato y cuánto más caro es en las demás.
    columns:
      - name: offer_key
        data_tests: [unique, not_null]
      - name: canonical_product_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_canonical_products'), field: canonical_product_id}}
      - name: store_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_stores'), field: store_id}}
      - name: is_price_outlier
        description: La diferencia entre la tienda más cara y la más barata es de más de 3 veces; el código de barras probablemente agrupa productos distintos.

  - name: fct_price_changes
    description: Un evento por cada cambio de precio, precio de lista o disponibilidad.
    columns:
      - name: price_id
        data_tests: [unique, not_null]
      - name: store_product_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_products'), field: store_product_id}}
      - name: run_id
        data_tests:
          - relationships: {arguments: {to: ref('fct_scrape_runs'), field: run_id}}

  - name: fct_current_prices
    description: Precio vigente de cada producto.
    columns:
      - name: store_product_id
        data_tests:
          - unique
          - not_null
          - relationships: {arguments: {to: ref('dim_products'), field: store_product_id}}

  - name: fct_scrape_runs
    description: Una fila por descarga de una tienda.
    columns:
      - name: run_id
        data_tests: [unique, not_null]

  - name: fct_daily_prices
    description: Precio vigente de cada producto en cada día (una fila por producto y día).
    columns:
      - name: daily_price_key
        data_tests: [unique, not_null]
      - name: date_day
        data_tests:
          - relationships: {arguments: {to: ref('all_dates'), field: date_day}}
      - name: store_product_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_products'), field: store_product_id}}

  - name: fct_scrape_coverage
    description: Por descarga y categoría, lo que reporta el sitio frente a lo descargado.
    columns:
      - name: coverage_key
        data_tests: [unique, not_null]
      - name: run_id
        data_tests:
          - relationships: {arguments: {to: ref('fct_scrape_runs'), field: run_id}}

  - name: fct_match_review
    description: Cruces por nombre dudosos pendientes de revisión (se deciden en el seed match_overrides).
    columns:
      - name: product_key
        data_tests: [unique, not_null]

  - name: web_products
    description: >
      Productos que se pueden elegir en la web: cada producto canónico y cada producto sin cruzar
      (id 'sku-<store_product_id>', de una sola tienda). Base de la lista de compras.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: product_name
        data_tests: [not_null]

  - name: web_offers
    description: Precio de cada producto de web_products en cada tienda (una fila por producto y tienda).
    columns:
      - name: offer_key
        data_tests: [unique, not_null]
      - name: product_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('web_products'), field: product_id}}
      - name: store_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_stores'), field: store_id}}
